<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вет-клиника Бетховен</title>
    <link href="css/style.css" rel="stylesheet">
    <script src="js/doctors.js"></script>
</head>
<body>
    <a href="index.html" class="back">←Назад</a>
    <div class="objects">
        <h1>Список докторов</h1>
        <ol id="doctors-list"></ol>
    </div>


    <!-- Область создания нового доктора -->
    <h1>Добавление нового доктора</h1>
    <input id="add_name" placeholder="Имя">
    <input id="add_age" placeholder="Возраст">
    <input id="add_sex" placeholder="Пол">
    <button id="add-btn">Добавить</button>

    <!-- Область изменения информации о докторе -->
    <h1>Изменение информации о докторе</h1>
    <input id="update_id" placeholder="Номер доктора">
    <input id="update_name" placeholder="Имя">
    <input id="update_age" placeholder="Возраст">
    <input id="update_sex" placeholder="Пол">
    <button id="update-btn">Изменить</button>

    <!-- Область удаления доктора -->
    <h1>Удаление доктора</h1>
    <input id="delete_id" placeholder="Номер доктора">
    <button id="delete-btn">Удалить</button>

</body>
</html>
